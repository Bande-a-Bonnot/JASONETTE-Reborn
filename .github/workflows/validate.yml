name: Validate Schema

on:
  workflow_call:

jobs:
  validate:
    runs-on: getmac-tahoe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Validate Jasonpedia against JSON Schema
        run: node scripts/validate-schema.mjs
