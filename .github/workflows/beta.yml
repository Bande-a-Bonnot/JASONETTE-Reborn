name: Beta Build

on:
  push:
    branches: [main]
    paths:
      - "JASONETTE-iOS/JasonetteApp/**"
      - ".github/workflows/beta.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  build-and-distribute:
    runs-on: getmac-tahoe
    timeout-minutes: 60
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: JASONETTE-iOS/JasonetteApp
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Setup mise
        run: |
          eval "$(mise activate bash)"
          mise install

      - name: Setup Ruby
        run: rbenv install --skip-existing

      - name: Install Ruby dependencies
        run: |
          bundle config set frozen true
          bundle install --jobs 4 --retry 3

      - name: Compute version
        id: version
        run: |
          set -uo pipefail
          VERSION=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || true)
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Fetch signing credentials
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
          APPLE_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane ios fetch_signing

      - name: Build IPA
        run: |
          bundle exec fastlane ios build \
            version:${{ steps.version.outputs.version }} \
            build_number:${{ github.run_number }}

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: "true"
        run: bundle exec fastlane ios upload_testflight

      - name: Tag beta build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}-beta.${{ github.run_number }}"
          git push origin "v${{ steps.version.outputs.version }}-beta.${{ github.run_number }}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain fastlane_tmp_keychain 2>/dev/null || true
