name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      web: ${{ steps.filter.outputs.web }}
      conformance: ${{ steps.filter.outputs.conformance }}
      docs: ${{ steps.filter.outputs.docs }}
      template-engine: ${{ steps.filter.outputs.template-engine }}
      web-renderer: ${{ steps.filter.outputs.web-renderer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spec:
              - 'spec/**'
              - 'packages/spec/**'
              - 'Jasonpedia/**'
            web:
              - 'Jasonette-Web/**'
            conformance:
              - 'spec/conformance/**'
            docs:
              - '**/*.md'
            template-engine:
              - 'packages/template-engine/**'
            web-renderer:
              - 'packages/web-renderer/**'

  validate:
    needs: changes
    if: needs.changes.outputs.spec == 'true' || github.event_name == 'pull_request'
    uses: ./.github/workflows/validate.yml

  template-engine:
    needs: changes
    if: needs.changes.outputs.template-engine == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/template-engine
      - name: Test
        run: npm test
        working-directory: packages/template-engine
      - name: Build
        run: npm run build
        working-directory: packages/template-engine

  web-renderer:
    needs: changes
    if: needs.changes.outputs.web-renderer == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
        working-directory: packages/web-renderer
      - name: Test
        run: npm test
        working-directory: packages/web-renderer
      - name: Build
        run: npm run build
        working-directory: packages/web-renderer

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            **/*.md
            !node_modules/**
            !JASONETTE-iOS/**
            !JASONETTE-Android/**
            !Jasonette-Blog/**
            !Jasonette-documentation/**
            !Jasonpedia/**
            !Jasonette-Web/**
